<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>금융위기 대응 시뮬레이터</title>
    <script>
      // Stamp the resolved theme before first paint so the dark palette (declared
      // once, under [data-theme='dark']) applies without a flash.
      ;(function () {
        try {
          var raw = localStorage.getItem('fcs:settings')
          var s = raw ? JSON.parse(raw) : null
          var theme = (s && s.theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          // Only the scale — the base size stays in CSS so media queries still reach it.
          // Skipping scale 1 keeps the default first paint free of any inline style at all.
          if (s && typeof s.fontScale === 'number' && s.fontScale !== 1)
            root.style.setProperty('--fs-scale', String(s.fontScale))
          // Only a non-default density needs stamping; 'normal' is what the bare :root already is.
          if (s && (s.density === 'compact' || s.density === 'comfortable'))
            root.setAttribute('data-density', s.density)
          if (s && s.reducedMotion) root.setAttribute('data-reduced-motion', 'true')
          if (s && s.useSystemFont) root.setAttribute('data-system-font', 'true')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
